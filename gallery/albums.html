<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verseluft | Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #141518;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* The Classic Purple Gradient Style */
        .gallery-card {
            background: linear-gradient(135deg, #502699 0%, #381472 40%, #3f0a3f 100%) !important;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gallery-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.4);
        }

        .glass-nav {
            background: rgba(42, 43, 46, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #full-view-overlay {
            background: rgba(0,0,0,0.95);
            display: none;
            z-index: 200;
        }

        /* Transitions */
        .fade-out { opacity: 0; pointer-events: none; transform: scale(0.98); }
        .fade-in { opacity: 1; transform: scale(1); }
        .stage { transition: all 0.5s ease; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #a78bfa;
        }

        /* Tag Pill Style */
        .tag-pill {
            font-size: 0.65rem;
            padding: 2px 8px;
            background: rgba(167, 139, 250, 0.2);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 4px;
            color: #a78bfa;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Alpha Filter Styles */
        .alpha-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
        }
        .alpha-btn.active {
            background: #7c3aed;
            border-color: #8b5cf6;
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
        .alpha-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body class="selection:bg-purple-500/30">

    <!-- Navigation -->
    <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-5xl flex justify-between items-center px-8 py-4 glass-nav rounded-2xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                <div class="w-6 h-6 border-4 border-black rotate-45"></div>
            </div>
            <span class="text-2xl font-bold tracking-tighter uppercase">Verseluft</span>
        </div>
        <div class="hidden md:flex gap-8 text-sm font-medium text-slate-400">
            <a href="#" class="hover:text-purple-400">Home</a>
            <a href="#" class="text-purple-400">Gallery</a>
            <a href="#" class="hover:text-purple-400">Contact</a>
        </div>
    </nav>

    <!-- STAGE 1: MAIN ARCHIVE -->
    <div id="stage-archive" class="stage min-h-screen pt-44 pb-32 px-6 md:px-12 max-w-7xl mx-auto">
        <header class="mb-16">
            <span class="text-purple-500 font-bold tracking-[0.2em] text-xs uppercase mb-4 block">Portfolio</span>
            <h1 class="text-5xl md:text-7xl font-bold mb-12 tracking-tight">Our Projects<span class="text-purple-500">.</span></h1>
            
            <div class="flex gap-3 overflow-x-auto pb-4 no-scrollbar">
                <button onclick="filterProjects('All')" class="proj-filter-btn px-6 py-2 rounded-full text-sm font-semibold transition-all border bg-purple-600 border-purple-500">All</button>
                <button onclick="filterProjects('Industrial')" class="proj-filter-btn px-6 py-2 rounded-full text-sm font-semibold transition-all border bg-[#1a1b1e] border-white/10 text-slate-400 hover:text-white">Industrial</button>
                <button onclick="filterProjects('Residential')" class="proj-filter-btn px-6 py-2 rounded-full text-sm font-semibold transition-all border bg-[#1a1b1e] border-white/10 text-slate-400 hover:text-white">Residential</button>
                <button onclick="filterProjects('Maintenance')" class="proj-filter-btn px-6 py-2 rounded-full text-sm font-semibold transition-all border bg-[#1a1b1e] border-white/10 text-slate-400 hover:text-white">Maintenance</button>
            </div>
        </header>

        <div id="main-grid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <p class="text-slate-500 italic col-span-full">Initializing gallery...</p>
        </div>
    </div>

    <!-- STAGE 2: PROJECT ALBUM GRID -->
    <div id="stage-album" class="stage hidden min-h-screen pt-44 pb-32 px-6 md:px-12 max-w-7xl mx-auto">
        <button onclick="backToArchive()" class="flex items-center gap-2 text-slate-400 hover:text-white mb-12 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Archive
        </button>

        <div class="mb-12">
            <h2 id="album-title" class="text-4xl md:text-6xl font-bold tracking-tight mb-4"></h2>
            <p id="album-desc" class="text-slate-400 text-lg max-w-2xl"></p>
        </div>

        <!-- Filters Section -->
        <div class="flex flex-col lg:flex-row gap-8 mb-12 items-start lg:items-center justify-between border-y border-white/5 py-10">
            <!-- Tag Filter -->
            <div class="w-full lg:w-auto">
                <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 mb-4 block">Asset Categories</span>
                <div id="tag-filter-container" class="flex flex-wrap gap-2">
                    <!-- Tags will be injected here -->
                </div>
            </div>

            <!-- Alphabet Filter -->
            <div class="w-full lg:w-auto">
                <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 mb-4 block">Alphabetical Index</span>
                <div id="alpha-filter-container" class="flex flex-wrap gap-1.5">
                    <!-- Letters will be injected here -->
                </div>
            </div>
        </div>

        <div id="album-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Individual images injected here -->
        </div>
    </div>

    <!-- FULL SIZE IMAGE VIEW -->
    <div id="full-view-overlay" class="fixed inset-0 flex items-center justify-center p-4 md:p-12" onclick="handleOverlayClick(event)">
        <button onclick="navigateFullView(-1)" class="nav-btn absolute left-4 md:left-8 w-12 h-12 rounded-full flex items-center justify-center text-white z-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <div class="relative flex flex-col items-center max-w-full max-h-full">
            <img id="full-img" src="" class="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl transition-all duration-300">
            <div class="mt-8 text-center bg-black/40 backdrop-blur-md px-8 py-4 rounded-2xl border border-white/5">
                <span id="full-tag" class="tag-pill mb-2 inline-block"></span>
                <h4 id="full-name" class="text-xl md:text-3xl font-bold tracking-tight text-white uppercase"></h4>
            </div>
        </div>
        
        <button onclick="navigateFullView(1)" class="nav-btn absolute right-4 md:right-8 w-12 h-12 rounded-full flex items-center justify-center text-white z-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>

        <button onclick="closeFullView()" class="absolute top-8 right-8 text-white/50 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <script>
        let allProjects = [];
        let currentProjectImages = []; 
        let currentImageIndex = -1;
        let activeTag = 'ALL';
        let activeAlpha = 'ALL';

        const placeholderProjects = [
            { 
                id: 1, category: 'Industrial', title: 'Cyber City', desc: 'Exploration of location and character assets.', 
                thumb: 'https://images.unsplash.com/photo-1581094288338-2314dddb7bc3?q=80&w=800',
                images: [
                    { url: 'https://od.lk/s/NzVfNTgxODk2ODFf/Aera%20Windlace.jpg', tag: 'LOCATION' },
                    { url: 'https://images.unsplash.com/photo-1504328345606?q=2', tag: 'NPC', name: 'MERCHANT' },
                    { url: 'https://images.unsplash.com/photo-1531297484001?q=3', tag: 'LOCATION', name: 'DATA CENTER' },
                    { url: 'https://images.unsplash.com/photo-1565347878219?q=4', tag: 'NPC', name: 'GUARD' }
                ]
            }
        ];

        async function loadProjects() {
            try {
                const response = await fetch('albums.json');
                if (!response.ok) throw new Error('File not found');
                const data = await response.json();
                allProjects = data.items || placeholderProjects;
            } catch (error) {
                console.warn("External data load failed. Falling back to internal data.", error);
                allProjects = placeholderProjects;
            } finally {
                renderArchive(allProjects);
            }
        }

        function renderArchive(items) {
            const grid = document.getElementById('main-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'gallery-card group relative rounded-[2.5rem] overflow-hidden p-8 flex flex-col h-[500px] cursor-pointer';
                card.onclick = () => openAlbum(item);
                card.innerHTML = `
                    <div class="flex-grow">
                        <span class="inline-block px-4 py-1 bg-black/20 rounded-full text-[10px] font-bold tracking-widest uppercase mb-4">${item.category}</span>
                        <h3 class="text-3xl font-bold mb-4">${item.title}</h3>
                        <p class="text-white/70 line-clamp-2">${item.desc}</p>
                    </div>
                    <div class="h-[240px] rounded-3xl overflow-hidden border border-white/10 relative">
                        <img src="${item.thumb}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" onerror="this.src='https://via.placeholder.com/800x400?text=Image+Not+Found'">
                        <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function processImage(imgData, index) {
            let url = typeof imgData === 'string' ? imgData : imgData.url;
            let tag = imgData.tag || 'NONE';
            let name = imgData.name;

            if (!name) {
                try {
                    const urlObj = new URL(url);
                    const pathname = urlObj.pathname;
                    const filenameWithExt = pathname.substring(pathname.lastIndexOf('/') + 1);
                    const decodedName = decodeURIComponent(filenameWithExt);
                    name = decodedName.replace(/\.[^/.]+$/, "").toUpperCase();
                    if (!name || name === "") name = `IMAGE ${index + 1}`;
                } catch (e) {
                    name = `IMAGE ${index + 1}`;
                }
            }

            return {
                url: url,
                tag: tag,
                name: name.replace(/[-_]/g, ' ')
            };
        }

        function openAlbum(project) {
            const archive = document.getElementById('stage-archive');
            const album = document.getElementById('stage-album');
            
            document.getElementById('album-title').innerText = project.title;
            document.getElementById('album-desc').innerText = project.desc;
            
            currentProjectImages = project.images.map((img, i) => processImage(img, i));
            
            // Build Tags
            const tags = ['ALL', ...new Set(currentProjectImages.map(img => img.tag))];
            const tagContainer = document.getElementById('tag-filter-container');
            tagContainer.innerHTML = '';
            
            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = `tag-btn px-6 py-2 rounded-full text-[10px] font-bold tracking-widest uppercase transition-all border ${tag === 'ALL' ? 'bg-purple-600 border-purple-500 text-white shadow-lg shadow-purple-900/20' : 'bg-white/5 border-white/10 text-slate-400 hover:text-white hover:bg-white/10'}`;
                
                const count = tag === 'ALL' ? currentProjectImages.length : currentProjectImages.filter(i => i.tag === tag).length;
                
                btn.innerHTML = `${tag} <span class="ml-1 opacity-40">(${count})</span>`;
                btn.onclick = () => filterImagesByTag(tag);
                tagContainer.appendChild(btn);
            });

            // Build Alphabet Bar
            const alphaContainer = document.getElementById('alpha-filter-container');
            alphaContainer.innerHTML = '';
            const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
            
            letters.forEach(letter => {
                const btn = document.createElement('button');
                const hasImages = letter === 'ALL' || currentProjectImages.some(img => img.name.startsWith(letter));
                
                btn.className = `alpha-btn ${letter === 'ALL' ? 'active' : ''} ${!hasImages ? 'opacity-20 pointer-events-none' : ''}`;
                btn.innerText = letter;
                if(hasImages) btn.onclick = () => filterImagesByAlpha(letter);
                alphaContainer.appendChild(btn);
            });

            activeTag = 'ALL';
            activeAlpha = 'ALL';
            renderAlbumGrid();

            archive.classList.add('fade-out');
            setTimeout(() => {
                archive.classList.add('hidden');
                album.classList.remove('hidden');
                window.scrollTo(0,0);
                setTimeout(() => album.classList.add('fade-in'), 10);
            }, 500);
        }

        function filterImagesByTag(tag) {
            activeTag = tag;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                if(btn.innerText.includes(tag)) {
                    btn.classList.add('bg-purple-600', 'border-purple-500', 'text-white', 'shadow-lg', 'shadow-purple-900/20');
                    btn.classList.remove('bg-white/5', 'border-white/10', 'text-slate-400');
                } else {
                    btn.classList.remove('bg-purple-600', 'border-purple-500', 'text-white', 'shadow-lg', 'shadow-purple-900/20');
                    btn.classList.add('bg-white/5', 'border-white/10', 'text-slate-400');
                }
            });
            renderAlbumGrid();
        }

        function filterImagesByAlpha(letter) {
            activeAlpha = letter;
            document.querySelectorAll('.alpha-btn').forEach(btn => {
                if(btn.innerText === letter) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderAlbumGrid();
        }

        function renderAlbumGrid() {
            const grid = document.getElementById('album-grid');
            grid.innerHTML = '';
            
            let filteredImages = currentProjectImages;

            // Apply Tag Filter
            if (activeTag !== 'ALL') {
                filteredImages = filteredImages.filter(img => img.tag === activeTag);
            }

            // Apply Alpha Filter
            if (activeAlpha !== 'ALL') {
                filteredImages = filteredImages.filter(img => img.name.startsWith(activeAlpha));
            }

            if (filteredImages.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-slate-500 font-medium">No assets found matching these filters.</div>';
                return;
            }

            filteredImages.forEach((imgObj) => {
                const originalIndex = currentProjectImages.findIndex(orig => orig.url === imgObj.url);
                const container = document.createElement('div');
                container.className = 'album-item relative w-full aspect-square rounded-xl overflow-hidden cursor-zoom-in group border border-white/5';
                container.onclick = () => openFullView(originalIndex);
                
                container.innerHTML = `
                    <img src="${imgObj.url}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" onerror="this.src='https://via.placeholder.com/400?text=Image+Not+Found'">
                    <!-- Always visible name overlay with gradient background -->
                    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black via-black/40 to-transparent flex flex-col items-start justify-end p-5 pointer-events-none">
                        ${imgObj.tag !== 'NONE' ? `<span class="tag-pill mb-1.5 shadow-sm">${imgObj.tag}</span>` : ''}
                        <span class="text-[11px] font-bold uppercase tracking-widest text-white truncate w-full drop-shadow-md">
                            ${imgObj.name}
                        </span>
                    </div>
                `;
                grid.appendChild(container);
            });
        }

        function backToArchive() {
            const archive = document.getElementById('stage-archive');
            const album = document.getElementById('stage-album');
            album.classList.remove('fade-in');
            setTimeout(() => {
                album.classList.add('hidden');
                archive.classList.remove('hidden');
                setTimeout(() => archive.classList.remove('fade-out'), 10);
            }, 500);
        }

        function openFullView(index) {
            currentImageIndex = index;
            const overlay = document.getElementById('full-view-overlay');
            updateFullImage();
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function updateFullImage() {
            const img = document.getElementById('full-img');
            const nameEl = document.getElementById('full-name');
            const tagEl = document.getElementById('full-tag');
            const currentImg = currentProjectImages[currentImageIndex];

            img.style.opacity = '0';
            setTimeout(() => {
                img.src = currentImg.url;
                nameEl.innerText = currentImg.name;
                
                if (currentImg.tag !== 'NONE') {
                    tagEl.innerText = currentImg.tag;
                    tagEl.style.display = 'inline-block';
                } else {
                    tagEl.style.display = 'none';
                }
                
                img.style.opacity = '1';
            }, 150);
        }

        function navigateFullView(direction) {
            currentImageIndex += direction;
            if (currentImageIndex >= currentProjectImages.length) currentImageIndex = 0;
            if (currentImageIndex < 0) currentImageIndex = currentProjectImages.length - 1;
            updateFullImage();
        }

        function handleOverlayClick(e) {
            if (e.target.id === 'full-view-overlay' || e.target.id === 'full-img') {
                closeFullView();
            }
        }

        function closeFullView() {
            document.getElementById('full-view-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            currentImageIndex = -1;
        }

        document.addEventListener('keydown', (e) => {
            if (currentImageIndex === -1) return; 
            if (e.key === 'ArrowRight') navigateFullView(1);
            else if (e.key === 'ArrowLeft') navigateFullView(-1);
            else if (e.key === 'Escape') closeFullView();
        });

        function filterProjects(cat) {
            const filtered = cat === 'All' ? allProjects : allProjects.filter(p => p.category === cat);
            renderArchive(filtered);
            document.querySelectorAll('.proj-filter-btn').forEach(btn => {
                if(btn.innerText === cat) {
                   btn.classList.add('bg-purple-600', 'border-purple-500');
                   btn.classList.remove('bg-[#1a1b1e]', 'text-slate-400');
                } else {
                   btn.classList.remove('bg-purple-600', 'border-purple-500');
                   btn.classList.add('bg-[#1a1b1e]', 'text-slate-400');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
