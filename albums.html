<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verseluft | Project Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #141518;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .gallery-card {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 40%, #881d95 100%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.3);
        }

        .glass-nav {
            background: rgba(42, 43, 46, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pill-tag {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lightbox-overlay {
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(20px);
            display: none;
        }

        .lightbox-active {
            display: flex !important;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #1a1b1e 25%, #2a2b2e 50%, #1a1b1e 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="selection:bg-purple-500/30">

    <!-- Navigation -->
    <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-5xl flex justify-between items-center px-8 py-4 glass-nav rounded-2xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                <div class="w-6 h-6 border-4 border-black rotate-45"></div>
            </div>
            <span class="text-2xl font-bold tracking-tighter uppercase">Verseluft</span>
        </div>
        
        <div class="hidden md:flex gap-8 text-sm font-medium text-slate-400">
            <a href="#" class="hover:text-purple-400 transition-colors">Home</a>
            <a href="#" class="text-purple-400">Gallery</a>
            <a href="#" class="hover:text-purple-400 transition-colors">Tools</a>
            <a href="#" class="hover:text-purple-400 transition-colors">Contact</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="pt-44 pb-12 px-6 md:px-12 max-w-7xl mx-auto">
        <div class="max-w-2xl">
            <span class="text-purple-500 font-bold tracking-[0.2em] text-xs uppercase mb-4 block animate-pulse">
                Soon will be launch
            </span>
            <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tight leading-[1.1]">
                Our Future <br />
                <span class="underline decoration-purple-100 decoration-4 underline-offset-8">projects</span>
                <span class="text-purple-500 ml-2">●</span>
            </h1>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="px-6 md:px-12 max-w-7xl mx-auto mb-12">
        <div class="flex gap-3 overflow-x-auto pb-4 no-scrollbar" id="filter-container">
            <button onclick="filterGallery('All')" class="filter-btn active-filter px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 border bg-purple-600 border-purple-500 text-white shadow-[0_0_20px_rgba(124,58,237,0.3)]">All</button>
            <button onclick="filterGallery('Black Cube Games')" class="filter-btn px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 border bg-[#1a1b1e] border-white/10 text-slate-400 hover:border-purple-500/50">Black Cube Games</button>
            <button onclick="filterGallery('Moonstone Sculpture')" class="filter-btn px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 border bg-[#1a1b1e] border-white/10 text-slate-400 hover:border-purple-500/50">Moonstone Sculpture</button>
           <!-- <button onclick="filterGallery('Maintenance')" class="filter-btn px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 border bg-[#1a1b1e] border-white/10 text-slate-400 hover:border-purple-500/50">Maintenance</button> -->
        </div>
    </div>

    <!-- Gallery Grid -->
    <main class="px-6 md:px-12 max-w-7xl mx-auto pb-32">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10" id="gallery-grid">
            <!-- Loading Skeletons -->
            <div class="h-[580px] rounded-[3rem] loading-shimmer opacity-20"></div>
            <div class="h-[580px] rounded-[3rem] loading-shimmer opacity-20"></div>
        </div>
    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 md:p-8 lightbox-overlay">
        <button onclick="closeLightbox()" class="absolute top-8 right-8 text-white/50 hover:text-white transition-colors bg-white/5 p-4 rounded-full z-[110]">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        
        <div class="max-w-6xl w-full flex flex-col md:flex-row bg-[#1a1b1e] rounded-[4rem] overflow-hidden border border-white/10 shadow-3xl max-h-[90vh]">
            <div class="md:w-3/5 bg-black flex items-start justify-center relative overflow-hidden h-72 md:h-auto">
                <img id="lightbox-img" src="" alt="" class="w-full object-cover object-top top-0">
            </div>
            <div class="md:w-2/5 p-10 md:p-14 flex flex-col justify-between bg-[#1a1b1e] overflow-y-auto">
                <div>
                    <span id="lightbox-cat" class="text-purple-500 font-bold uppercase tracking-widest text-xs mb-6 block"></span>
                    <h2 id="lightbox-title" class="text-4xl font-bold mb-8 tracking-tight"></h2>
                    <p id="lightbox-desc" class="text-slate-400 text-lg leading-relaxed mb-10"></p>
                </div>
                
                <button class="w-full py-6 bg-purple-600 text-white font-bold rounded-[1.5rem] hover:bg-purple-500 transition-all shadow-xl shadow-purple-900/40 flex items-center justify-center gap-3 active:scale-95 text-lg">
                    Request Case Study
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Placeholder data to use if albums.json is missing
        const placeholders = [
            { id: 1, category: 'Industrial', title: 'Order of Merchants', desc: '10 special merchant guilds, crafted for D&D, with hand painted art.', image: 'https://images.unsplash.com/photo-1581094288338-2314dddb7bc3?auto=format&fit=crop&q=80&w=1200' },
            { id: 2, category: 'Residential', title: 'What happens between cities?', desc: 'A complete source book to navigate a party from a city to another safely.', image: 'https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&q=80&w=1200' },
            { id: 3, category: 'Maintenance', title: 'No Way Out', desc: 'Feel the fear of the night and deceptive monsters in this horror adventure.', image: 'https://images.unsplash.com/photo-1621905251918-48416bd8575a?auto=format&fit=crop&q=80&w=1200' },
            { id: 4, category: 'Industrial', title: 'The Iron Lung', desc: 'Heavy duty ventilation systems for deep mining operations and safety.', image: 'https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?auto=format&fit=crop&q=80&w=1200' },
            { id: 5, category: 'Residential', title: 'Aether Flow', desc: 'Next-gen residential air purification with minimalist aesthetic design.', image: 'https://images.unsplash.com/photo-1600585154340-be6199f7e009?auto=format&fit=crop&q=80&w=1200' },
            { id: 6, category: 'Maintenance', title: 'System Refresh', desc: 'Complete overhaul of existing HVAC infrastructure for modern efficiency.', image: 'https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&q=80&w=1200' }
        ];

        let currentData = [];
        let activeFilter = 'All';

        async function initGallery() {
            try {
                const response = await fetch('albums.json');
                if (!response.ok) throw new Error('File not found');
                const data = await response.json();
                currentData = data.items || data; // Handle both {items: []} and [] formats
                console.log('Successfully loaded data from albums.json');
            } catch (error) {
                console.warn('albums.json not found or invalid. Using placeholders.', error);
                currentData = placeholders;
            }
            renderGallery(currentData);
        }

        function renderGallery(items) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-slate-500 text-xl font-medium">No projects found in this category.</div>';
                return;
            }

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-card group relative rounded-[3rem] overflow-hidden p-10 shadow-2xl flex flex-col h-[580px] border border-white/10 opacity-0 transform translate-y-10';
                card.style.transitionDelay = `${index * 50}ms`;
                card.onclick = () => openLightbox(item);
                
                card.innerHTML = `
                    <div class="flex-none">
                        <div class="inline-block px-5 py-2 pill-tag rounded-full text-[10px] font-bold text-white/90 mb-8 uppercase tracking-[0.15em]">
                            ${item.category}
                        </div>
                    </div>
                    <div class="flex-grow">
                        <h3 class="text-4xl font-bold text-white mb-5 tracking-tight group-hover:text-black/90 transition-colors duration-300">
                            ${item.title}
                        </h3>
                        <p class="text-white/70 text-lg mb-8 leading-relaxed max-w-sm line-clamp-3">
                            ${item.desc}
                        </p>
                    </div>
                    <div class="flex-none relative rounded-[2rem] overflow-hidden h-[280px] shadow-3xl border border-white/10 bg-[#141518] ">
                        <img src="${item.image}" alt="${item.title}" class=" top-0  w-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700 group-hover:scale-110" onerror="this.src='https://images.unsplash.com/photo-1554050857-c84a8baec521?q=80&w=800'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                    </div>
                    <div class="absolute top-10 right-10 w-14 h-14 rounded-full bg-black/20 backdrop-blur-md border border-white/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-500 group-hover:rotate-12 translate-x-4 group-hover:translate-x-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                    </div>
                `;
                grid.appendChild(card);
                
                setTimeout(() => {
                    card.classList.remove('opacity-0', 'translate-y-10');
                }, 50);
            });
        }

        function filterGallery(category) {
            activeFilter = category;
            
            // Update UI buttons
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.innerText === category) {
                    btn.className = 'filter-btn active-filter px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 border bg-purple-600 border-purple-500 text-white shadow-[0_0_20px_rgba(124,58,237,0.3)]';
                } else {
                    btn.className = 'filter-btn px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 border bg-[#1a1b1e] border-white/10 text-slate-400 hover:border-purple-500/50';
                }
            });

            const filtered = category === 'All' 
                ? currentData 
                : currentData.filter(i => i.category === category);
            
            renderGallery(filtered);
        }

        function openLightbox(item) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = item.image;
            document.getElementById('lightbox-cat').innerText = item.category;
            document.getElementById('lightbox-title').innerText = item.title;
            document.getElementById('lightbox-desc').innerText = item.desc ;
            
            lightbox.classList.add('lightbox-active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('lightbox-active');
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Click outside lightbox to close
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
